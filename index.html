<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="daeese.me" />
    <meta property="og:title" content="Meet daeeseD" />
    <meta
      property="og:description"
      content="daeese - fullstack developer working with C#, JavaScript, HTML and CSS."
    />
    <meta property="og:url" content="https://daeese.me/" />
    <meta property="og:image" content="https://daeese.me/filearchive/pfp22.jpeg" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#040203" />
    <link rel="icon" type="image/jpeg" href="./filearchive/lal.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-start: #040203;
        --bg-mid: #0b0408;
        --bg-end: #1d0813;
        --card: rgba(0, 0, 0, 0.685);
        --card-border: rgba(189, 0, 104, 0.342);
        --text: #e7eef7;
        --muted: #9caac0;
        --accent: #9e002f;
        --accent-2: #440114;
        --button-bg: rgba(255, 255, 255, 0.07);
        --button-hover: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        width: 100%;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        image-rendering: -webkit-optimize-contrast;
      }

      body {
        font-family: "Space Grotesk", sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at 16% 14%,
            rgba(145, 28, 74, 0.22) 0,
            rgba(145, 28, 74, 0) 40%
          ),
          radial-gradient(
            circle at 84% 84%,
            rgba(78, 15, 39, 0.16) 0,
            rgba(78, 15, 39, 0) 46%
          ),
          linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 64%, var(--bg-end) 100%);
        background-size: auto, auto, auto;
        background-position: auto, auto, auto;
        background-attachment: fixed;
        display: grid;
        place-items: center;
      }

      body.modal-open {
        overflow: hidden;
      }

      .noise {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.08;
        background-image: radial-gradient(#ffffff 0.45px, transparent 0.45px);
        background-size: 2px 2px;
      }

      .halo {
        position: fixed;
        z-index: 1;
        border-radius: 999px;
        filter: blur(42px);
        opacity: 0.38;
        pointer-events: none;
        animation: float 12s ease-in-out infinite;
      }

      .halo-1 {
        width: 260px;
        height: 260px;
        top: -90px;
        left: -80px;
        background: #080000b2;
      }

      .halo-2 {
        width: 220px;
        height: 220px;
        right: -70px;
        bottom: -50px;
        background: #00000088;
        animation-delay: -6s;
      }

      .blur-overlay {
        position: fixed;
        inset: 0;
        background: rgba(16, 6, 10, 0.28);
        backdrop-filter: blur(22px) saturate(1.25);
        -webkit-backdrop-filter: blur(22px) saturate(1.25);
        z-index: 999;
        display: grid;
        place-items: center;
        pointer-events: all;
        cursor: pointer;
        transition: opacity 220ms ease, background-color 220ms ease, backdrop-filter 220ms ease;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .blur-overlay.hidden {
        display: none;
      }

      .blur-overlay:active {
        background: rgba(16, 6, 10, 0.36);
      }

      .blur-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.02) 42%,
          rgba(255, 255, 255, 0.08) 100%
        );
        pointer-events: none;
      }

      .blur-message {
        position: relative;
        text-align: center;
        color: var(--text);
        font-size: 1.2rem;
        letter-spacing: 0.05em;
        animation: pulse-text 1.5s ease infinite;
        padding: 14px 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      }

      @keyframes pulse-text {
        0%, 100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      .site {
        width: min(620px, 92vw);
        max-width: 100%;
        margin: 24px auto;
        padding: 0 8px;
        position: relative;
        z-index: 2;
        animation: fade-in 0.75s ease both;
      }

      .card {
        border: 1px solid var(--card-border);
        border-radius: 22px;
        background:
          radial-gradient(circle at 16% 14%, rgba(145, 28, 74, 0.16) 0, rgba(145, 28, 74, 0) 40%),
          radial-gradient(circle at 84% 84%, rgba(78, 15, 39, 0.12) 0, rgba(78, 15, 39, 0) 46%),
          linear-gradient(160deg, rgba(4, 2, 3, 0.74) 0%, rgba(11, 4, 8, 0.66) 64%, rgba(29, 8, 19, 0.72) 100%);
        backdrop-filter: blur(28px) saturate(1.2);
        -webkit-backdrop-filter: blur(28px) saturate(1.2);
        padding: 28px 22px;
        width: 100%;
        overflow: clip;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top left, rgba(145, 28, 74, 0.12), transparent 34%),
          radial-gradient(circle at bottom right, rgba(78, 15, 39, 0.1), transparent 34%);
        pointer-events: none;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .card-wrapper {
        width: 100%;
      }

      .top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }

      .discord-status-badge {
        position: absolute;
        right: 12px;
        bottom: 4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0);
        z-index: 2;
        display: grid;
        place-items: center;
        box-shadow:
          0 0 0 2px rgba(5, 2, 4, 0.98),
          0 8px 18px rgba(0, 0, 0, 0.34);
      }

      .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(255, 255, 255, 0.28);
        margin-top: 0;
        z-index: 1;
        image-rendering: -webkit-optimize-contrast;
        filter: contrast(1.05) brightness(1.02) saturate(1.1);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        position: relative;
      }

      .avatar-shell {
        position: relative;
        width: 110px;
        height: 110px;
        flex-shrink: 0;
      }

      .discord-status-badge::before {
        content: "";
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: currentColor;
      }

      .discord-status-badge[data-status="online"] {
        color: #23a55a;
        background: #23a55a;
      }

      .discord-status-badge[data-status="idle"] {
        color: #f0b232;
        background: #f0b232;
      }

      .discord-status-badge[data-status="dnd"] {
        color: #f23f43;
        background: #f23f43;
      }

      .discord-status-badge[data-status="offline"] {
        color: #747f8d;
        background: #747f8d;
      }

      .discord-status-badge[data-status="invisible"] {
        color: #747f8d;
        background: #747f8d;
      }

      .name-handle-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        justify-content: center;
        width: 100%;
      }

      .name-wrap {
        min-width: 0;
      }

      .name {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 1px;
        font-size: clamp(2.1rem, 3.5vw, 2.8rem);
        line-height: 0.92;
      }

      .handle {
        margin: 4px 0 0;
        color: var(--muted);
        font-weight: 500;
      }

      .socials-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        padding: 2px 4px;
      }

      .socials-inline a {
        text-decoration: none;
        color: var(--text);
        cursor: pointer;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        display: grid;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        line-height: 1;
        overflow: visible;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 0 18px rgba(145, 28, 74, 0.2),
          0 0 26px rgba(78, 15, 39, 0.15);
      }

      .socials-inline a:hover {
        border-color: rgba(255, 255, 255, 0.28);
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          0 0 20px rgba(145, 28, 74, 0.24),
          0 0 32px rgba(78, 15, 39, 0.16);
      }

      .socials-inline svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
        display: block;
        flex: 0 0 auto;
      }

      .socials-inline img {
        width: 17px;
        height: 17px;
        object-fit: contain;
        display: block;
        flex: 0 0 auto;
      }

      .bio {
        margin: 18px 0 8px;
        color: #d2deee;
        line-height: 1.52;
        white-space: pre-line;
      }

      .badges {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 0;
        padding: 0;
      }

      .badges li {
        font-size: 0.83rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        padding: 6px 10px;
        border-radius: 999px;
        color: #d9e7f9;
        background: rgba(255, 255, 255, 0.04);
      }

      .section-title {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 24px 2px 10px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin: 24px 0 12px;
      }

      .tab-btn {
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.82rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .tab-btn[aria-selected="true"] {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.35);
      }

      .tab-panel[hidden] {
        display: none;
      }

      .links {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .link-btn {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 12px;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        text-decoration: none;
        cursor: pointer;
        color: var(--text);
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: var(--button-bg);
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        transform: translateY(14px);
        opacity: 0;
        animation: slide-up 0.45s ease forwards;
      }

      .link-btn:hover {
        background: var(--button-hover);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }

      .link-btn .left {
        display: block;
        flex: 1 1 auto;
        font-weight: 600;
        color: var(--text);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: color 160ms ease;
      }

      .now-playing-left {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .now-playing-cover {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
          image-rendering: -webkit-optimize-contrast;
          filter: contrast(1.05) brightness(1.02) saturate(1.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .now-playing-text {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-width: 0;
      }

      .now-playing-title {
        display: block;
        font-weight: 600;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .now-playing-title-inner {
        display: inline-block;
        white-space: nowrap;
        transform: translateX(0);
      }

      .now-playing-title.is-scrolling {
        text-overflow: clip;
      }

      .now-playing-title.is-scrolling .now-playing-title-inner {
        animation: marquee-x var(--marquee-duration, 8s) linear infinite alternate;
      }

      .now-playing-subtitle {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .link-btn .right {
        color: #eef4ff;
        font-size: 0.83rem;
        transition: color 160ms ease;
      }

      .link-btn:hover .left,
      .link-btn:hover .right {
        color: #d98aa8;
      }

      .projects {
        display: grid;
        gap: 10px;
      }

      .project-card {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.04);
      }

      .project-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .project-thumb {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      .project-title {
        margin: 0;
        font-size: 1rem;
      }

      .project-link-btn {
        position: relative;
      }

      .project-link-btn .left {
        transition: transform 180ms ease;
      }

      .project-link-hover-thumb {
        position: absolute;
        top: 50%;
        left: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-50%) scale(0.86);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .project-link-btn:hover .left {
        transform: translateX(44px);
      }

      .project-link-btn:hover .project-link-hover-thumb {
        opacity: 1;
        transform: translateY(-50%) scale(1);
      }

      .project-desc {
        margin: 6px 0 0;
        color: #d2deee;
        font-size: 0.93rem;
        line-height: 1.4;
      }

      .project-desc a {
        color: transparent;
        background-image: linear-gradient(135deg, #b73a67 0%, #9e2b55 45%, #c34f72 100%);
        -webkit-background-clip: text;
        background-clip: text;
        text-decoration: underline;
        text-decoration-color: rgba(195, 79, 114, 0.6);
        text-underline-offset: 2px;
      }

      .project-desc a:hover {
        background-image: linear-gradient(135deg, #c84a76 0%, #b23b67 45%, #d56687 100%);
        text-decoration-color: rgba(213, 102, 135, 0.75);
      }

      .project-links-empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (hover: none) {
        .project-link-btn:hover .left {
          transform: translateX(0);
        }

        .project-link-hover-thumb {
          display: none;
        }
      }

      .footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.83rem;
        text-align: center;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slide-up {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(10px, -12px);
        }
      }

      @keyframes marquee-x {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(calc(-1 * var(--marquee-distance, 0px)));
        }
      }

      .player-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: radial-gradient(
            circle at 16% 14%,
            rgba(145, 28, 74, 0.22) 0,
            rgba(145, 28, 74, 0) 40%
          ),
          radial-gradient(
            circle at 84% 84%,
            rgba(78, 15, 39, 0.16) 0,
            rgba(78, 15, 39, 0) 46%
          ),
          linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 64%, var(--bg-end) 100%);
        background-size: auto, auto, auto;
        background-position: auto, auto, auto;
        background-attachment: fixed;
        z-index: 1000;
        place-items: center;
        animation: fade-in 0.3s ease both;
      }

      .player-modal.active {
        display: grid;
      }

      .player-modal-content {
        width: min(500px, 90vw);
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 40px 24px;
        text-align: center;
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
        position: relative;
      }

      .player-close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 1.8rem;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 160ms ease;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .player-close-btn:hover {
        opacity: 1;
      }

      .player-disc {
        width: 240px;
        height: 240px;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.14);
        overflow: hidden;
        position: relative;
        animation: spin 20s linear infinite;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .player-disc::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.22);
        pointer-events: none;
      }

      .player-disc::after {
        content: "";
        position: absolute;
        width: 28px;
        height: 28px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(15, 15, 18, 0.95) 0%, rgba(8, 8, 10, 0.98) 100%);
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }

      .player-album-art {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        image-rendering: -webkit-optimize-contrast;
        filter: contrast(1.08) brightness(1.02) saturate(1.15);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .player-track-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 8px;
      }

      .player-track-artist {
        font-size: 1.1rem;
        color: var(--muted);
        margin: 0 0 8px;
      }

      .player-track-album {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0 0 24px;
      }

      .player-progress {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        height: 6px;
        margin: 0 0 24px;
        overflow: hidden;
      }

      .player-progress-bar {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        height: 100%;
        border-radius: 8px;
        width: 0%;
      }

      .player-time {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        color: var(--muted);
        margin: -14px 0 18px;
      }

      .player-listen-btn,
      .player-listen-btn:link,
      .player-listen-btn:visited,
      .player-listen-btn:active {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 12px;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        color: var(--text);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border: 1px solid rgba(158, 0, 47, 0.5);
        transition: filter 160ms ease, transform 160ms ease;
      }

      .player-listen-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

    <script>
      // --- Sound effects (Web Audio API) -------------------------------------
      // The context is created lazily inside a user gesture: browsers start it
      // suspended otherwise, which silently swallows every beep. The try/catch
      // keeps browsers without Web Audio from breaking the rest of this script.
      let audioContext = null;

      function ensureAudioContext() {
        if (audioContext) {
          return audioContext;
        }

        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) {
          return null;
        }

        try {
          audioContext = new AudioCtor();
        } catch (error) {
          audioContext = null;
        }

        return audioContext;
      }

      function playBeep(frequency = 800, duration = 100, volume = 0.3) {
        const ctx = ensureAudioContext();
        if (!ctx) {
          return;
        }

        if (ctx.state === "suspended") {
          ctx.resume();
        }

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = frequency;
        osc.type = "sine";
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration / 1000);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration / 1000);
      }

      function playSFX(type) {
        if (type === 'click') playBeep(600, 80, 0.2);
        else if (type === 'open') playBeep(1000, 120, 0.25);
        else if (type === 'close') playBeep(400, 120, 0.2);
        else if (type === 'hover') playBeep(700, 50, 0.15);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      // Blur overlay handler
      const blurOverlay = document.getElementById("blurOverlay");
      blurOverlay.addEventListener("click", () => {
        playSFX('click');
        blurOverlay.style.opacity = "0";
        blurOverlay.style.pointerEvents = "none";
        window.setTimeout(() => {
          blurOverlay.classList.add("hidden");
        }, 220);
      });

      const profileData = {
        name: "daeese",
        handle: "@daeese",
          bio: "I work with C#, JS, HTML & CSS, Main timezone is UTC -3 and sometimes UTC 0.\nFullstack Developer @ Vltra Entertainment.",
        avatar: "./filearchive/pfp22.jpeg",
            badges: ["C#", "JavaScript", "HTML", "CSS", "UTC-3"],
        links: [
          { label: "Contact Me", href: "mailto:rafaelpasquarella@gmail.com", tag: "E-Mail" },
          { id: "nowPlaying", label: "Now Playing", href: "https://open.spotify.com", tag: "Spotify" }
        ],
        spotify: {
          discordUserId: "1402344358199689348",
          refreshMs: 30000,
          onlySpotify: true
        },
        projects: [
          {
            title: "ccore - 'chavinhoCORE' Discord Application",
            description: "Utility and Automation discord bot for 12° Regimento de Infantaria in <a href=\"https://discord.gg/constantes\" target=\"_blank\" rel=\"noreferrer noopener\">CONSTANTES</a>.",
            href: "https://ccore.daeese.me",
            image: "./filearchive/newpfp.png"
          },
          {
            title: "VLTRA ENTERTAINMENT",
            description: "DEV @ VLTRA ENTERTAINMENT",
            href: "",
            image: "./filearchive/vltrasupport.png"
          }
        ],
        socials: [
          { label: "GitHub", href: "https://github.com/nunreasonable" },
          { label: "Discord", href: "https://discord.com/users/1402344358199689348" }
        ],
        policyLinks: [
          { label: "Terms of Service", href: "https://ccore.daeese.me/termsofservice/", tag: "Cornwall" },
            { label: "Privacy Policy", href: "https://ccore.daeese.me/privacypolicy/", tag: "Cornwall" },
            { label: "VLTRA INVITE", href: "https://discord.gg/3qdvhkNSS8", tag: "Vltra"}
        ],
        footer: "Last updated August 19, 2026"
      };

      const FALLBACK_ALBUM_ART = "https://i.scdn.co/image/ab67616d00001e02a0f8b88f0a2b2b3d92d8f57f";

      const avatarEl = document.getElementById("avatar");
      const discordStatusBadgeEl = document.getElementById("discordStatusBadge");
      // Load avatar from profile data if available. The markup already points at
      // the same file, so this does not trigger a second request.
      if (profileData.avatar) {
        avatarEl.src = profileData.avatar;
      }
      avatarEl.addEventListener("error", () => {
        avatarEl.src =
          "https://images.unsplash.com/photo-1527980965255-d3b416303d12?q=80&w=256&auto=format&fit=crop";
      });
      document.getElementById("displayName").textContent = profileData.name;
      document.getElementById("handle").textContent = profileData.handle;
      document.getElementById("bio").textContent = profileData.bio;
      document.getElementById("footerText").textContent = profileData.footer;

      // --- Player modal element refs -----------------------------------------
      // Declared before refreshNowPlaying() runs: setNowPlayingState() reads them
      // and can be reached synchronously when no Spotify config is present.
      const playerModal = document.getElementById("playerModal");
      const playerCloseBtn = document.getElementById("playerCloseBtn");
      const playerListenBtn = document.getElementById("playerListenBtn");
      const playerProgressBar = document.getElementById("playerProgressBar");
      const playerTimeCurrent = document.getElementById("playerTimeCurrent");
      const playerTimeTotal = document.getElementById("playerTimeTotal");
      let currentNowPlayingState = null;
      let playerProgressTimer = null;
      let lastFocusedBeforeModal = null;

      function normalizeUrl(rawUrl) {
        if (!rawUrl) {
          return "";
        }

        const trimmed = rawUrl.trim();
        const hasProtocol = /^(https?:\/\/|mailto:|tel:)/i.test(trimmed);
        return hasProtocol ? trimmed : `https://${trimmed}`;
      }

      function openProfileLink(rawUrl) {
        const safeUrl = normalizeUrl(rawUrl);
        if (!safeUrl) {
          return;
        }

        if (/^(mailto:|tel:)/i.test(safeUrl)) {
          window.location.href = safeUrl;
          return;
        }

        window.open(safeUrl, "_blank", "noopener,noreferrer");
      }

      // Only allow image URLs we are willing to put in a src attribute.
      function safeImageUrl(rawUrl, fallback) {
        const candidate = String(rawUrl || "").trim();
        if (/^https:\/\//i.test(candidate) || /^\.{0,2}\//.test(candidate)) {
          return candidate;
        }

        return fallback;
      }

      function getSocialIconMarkup(label, href) {
        const normalizedLabel = String(label || "").toLowerCase();
        const normalizedHref = String(href || "").toLowerCase();

        if (normalizedLabel.includes("discord") || normalizedHref.includes("discord.com")) {
          return '<img src="./filearchive/discordlogo.png" alt="" aria-hidden="true" />';
        }

        if (
          normalizedLabel.includes("github") ||
          normalizedHref.includes("github.com") ||
          normalizedHref.includes("git")
        ) {
          return '<img src="./filearchive/githublogo.png" alt="" aria-hidden="true" />';
        }

        return `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 2a7.94 7.94 0 0 1 5.29 2H6.71A7.94 7.94 0 0 1 12 4Zm-7.03 7h14.06a8.1 8.1 0 0 1 0 2H4.97a8.1 8.1 0 0 1 0-2Zm1.42 4h11.24A7.94 7.94 0 0 1 12 20a7.94 7.94 0 0 1-5.61-2ZM4.43 9a8.13 8.13 0 0 1 1.06-2h13.02a8.13 8.13 0 0 1 1.06 2Z"/>
          </svg>`;
      }

      const badgesEl = document.getElementById("badges");
      profileData.badges.forEach((badge) => {
        const item = document.createElement("li");
        item.textContent = badge;
        badgesEl.appendChild(item);
      });

      function normalizeDiscordStatus(rawStatus) {
        const status = typeof rawStatus === "string" ? rawStatus.toLowerCase() : "offline";
        if (status === "online" || status === "idle" || status === "dnd") {
          return status;
        }

        return status === "invisible" ? "invisible" : "offline";
      }

      function updateDiscordStatusBadge(status) {
        if (!discordStatusBadgeEl) {
          return;
        }

        const normalizedStatus = normalizeDiscordStatus(status);
        discordStatusBadgeEl.dataset.status = normalizedStatus;

        const statusLabelMap = {
          online: "Online",
          idle: "Idle",
          dnd: "Do not disturb",
          invisible: "Invisible",
          offline: "Offline"
        };

        discordStatusBadgeEl.title = `Discord status: ${statusLabelMap[normalizedStatus] || "Offline"}`;
      }

      const linksEl = document.getElementById("mainLinks");
      profileData.links.forEach((link, i) => {
        const a = document.createElement("a");
        a.className = "link-btn";
        a.href = normalizeUrl(link.href) || "#";
        a.dataset.url = link.href;
        a.dataset.linkId = link.id || "";
        a.target = "_blank";
        a.rel = "noreferrer noopener";
        a.style.animationDelay = `${100 + i * 75}ms`;
        a.innerHTML = `<span class="left">${escapeHtml(link.label)}</span><span class="right">${escapeHtml(link.tag)}</span>`;
        linksEl.appendChild(a);
      });

      function formatNowPlayingLabel(trackTitle, artistName) {
        return `Now Playing: ${trackTitle} - ${artistName}`;
      }

      function refreshNowPlayingTitleFit() {
        const titleEl = linksEl.querySelector('[data-link-id="nowPlaying"] .now-playing-title');
        if (!titleEl) {
          return;
        }

        const innerEl = titleEl.querySelector(".now-playing-title-inner");
        if (!innerEl) {
          return;
        }

        titleEl.classList.remove("is-scrolling");
        titleEl.style.removeProperty("--marquee-distance");
        titleEl.style.removeProperty("--marquee-duration");

        const overflowAmount = Math.ceil(innerEl.scrollWidth - titleEl.clientWidth);
        if (overflowAmount <= 4) {
          return;
        }

        const durationSeconds = Math.min(18, Math.max(6, overflowAmount / 24));
        titleEl.style.setProperty("--marquee-distance", `${overflowAmount}px`);
        titleEl.style.setProperty("--marquee-duration", `${durationSeconds}s`);
        titleEl.classList.add("is-scrolling");
      }

      function setNowPlayingState(state) {
        // Update player modal state
        currentNowPlayingState = state;
        updateDiscordStatusBadge(state && state.discordStatus);

        if (playerModal.classList.contains("active")) {
          updatePlayerDisplay();
        }

        const nowPlayingLink = linksEl.querySelector('[data-link-id="nowPlaying"]');
        if (!nowPlayingLink) {
          return;
        }

        const left = nowPlayingLink.querySelector(".left");
        const right = nowPlayingLink.querySelector(".right");
        if (!left || !right) {
          return;
        }

        // Everything below is third-party data from Lanyard, so it is escaped
        // before it reaches innerHTML.
        if (!state || !state.isPlaying) {
          const idleMessage = state && state.message ? state.message : "Spotify status idle";
          left.innerHTML = `
            <span class="now-playing-left">
              <img
                class="now-playing-cover"
                src="${escapeHtml(FALLBACK_ALBUM_ART)}"
                alt="No track artwork"
              />
              <span class="now-playing-text">
                <span class="now-playing-title"><span class="now-playing-title-inner">Not listening right now</span></span>
                <span class="now-playing-subtitle">${escapeHtml(idleMessage)}</span>
              </span>
            </span>
          `;
          right.textContent = "Spotify";
          nowPlayingLink.dataset.url = "https://open.spotify.com";
          nowPlayingLink.href = "https://open.spotify.com";
          refreshNowPlayingTitleFit();
          return;
        }

        const coverUrl = safeImageUrl(state.imageUrl, FALLBACK_ALBUM_ART);
        left.innerHTML = `
          <span class="now-playing-left">
            <img class="now-playing-cover" src="${escapeHtml(coverUrl)}" alt="Album artwork" />
            <span class="now-playing-text">
              <span class="now-playing-title"><span class="now-playing-title-inner">${escapeHtml(formatNowPlayingLabel(state.title, state.artist))}</span></span>
              <span class="now-playing-subtitle">${escapeHtml(state.album || "Live on Spotify")}</span>
            </span>
          </span>
        `;
        right.textContent = "Live";
        nowPlayingLink.dataset.url = state.trackUrl;
        nowPlayingLink.href = normalizeUrl(state.trackUrl) || "https://open.spotify.com";
        refreshNowPlayingTitleFit();
      }

      async function fetchNowPlayingFromLanyard(discordUserId) {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${encodeURIComponent(discordUserId)}`);
        if (!response.ok) {
          throw new Error("Failed to fetch Lanyard status.");
        }

        const payload = await response.json();
        if (!payload.success || !payload.data) {
          const errorMessage =
            payload.error && payload.error.message
              ? payload.error.message
              : "Spotify status unavailable";
          return { isPlaying: false, message: errorMessage, discordStatus: "offline" };
        }

        const data = payload.data;
        const discordStatus = normalizeDiscordStatus(data.discord_status);
        const spotifyOnlyMode = !profileData.spotify || profileData.spotify.onlySpotify !== false;

        function parseSpotifyState(rawSpotify) {
          if (!rawSpotify) {
            return null;
          }

          const startedAt = Number(rawSpotify.timestamps?.start) || 0;
          const endsAt = Number(rawSpotify.timestamps?.end) || 0;

          const trackUrl = rawSpotify.track_id
            ? `https://open.spotify.com/track/${encodeURIComponent(rawSpotify.track_id)}`
            : "https://open.spotify.com";

          return {
            isPlaying: true,
            title: rawSpotify.song || "Unknown song",
            artist: rawSpotify.artist || "Unknown artist",
            album: rawSpotify.album || "",
            imageUrl: rawSpotify.album_art_url || FALLBACK_ALBUM_ART,
            trackUrl,
            startedAt,
            endsAt
          };
        }

        function parseSpotifyActivity(activities) {
          if (!Array.isArray(activities)) {
            return null;
          }

          const spotifyActivity = activities.find((activity) => {
            const name = typeof activity.name === "string" ? activity.name.toLowerCase() : "";
            return name === "spotify";
          });

          if (!spotifyActivity) {
            return null;
          }

          const details = spotifyActivity.details || "Unknown song";
          const state = spotifyActivity.state || "Unknown artist";
          const album = spotifyActivity.assets?.large_text || "";
          const syncId = spotifyActivity.sync_id || "";
          const largeImage = spotifyActivity.assets?.large_image || "";
          const imageId = largeImage.startsWith("spotify:") ? largeImage.slice(8) : "";
          const startedAt = Number(spotifyActivity.timestamps?.start) || 0;
          const endsAt = Number(spotifyActivity.timestamps?.end) || 0;

          return {
            isPlaying: true,
            title: details,
            artist: state,
            album,
            imageUrl: imageId
              ? `https://i.scdn.co/image/${encodeURIComponent(imageId)}`
              : FALLBACK_ALBUM_ART,
            trackUrl: syncId
              ? `https://open.spotify.com/track/${encodeURIComponent(syncId)}`
              : "https://open.spotify.com",
            startedAt,
            endsAt
          };
        }

        const directSpotifyState = parseSpotifyState(data.spotify);
        const activitySpotifyState = parseSpotifyActivity(data.activities);
        const spotifyState = directSpotifyState || activitySpotifyState;

        if (!spotifyState) {
          return { isPlaying: false, discordStatus };
        }

        if (spotifyOnlyMode && data.listening_to_spotify === false && !activitySpotifyState) {
          return { isPlaying: false, discordStatus };
        }

        return { ...spotifyState, discordStatus };
      }

      async function refreshNowPlaying() {
        if (!profileData.spotify || !profileData.spotify.discordUserId) {
          setNowPlayingState({ isPlaying: false });
          return;
        }

        try {
          const state = await fetchNowPlayingFromLanyard(profileData.spotify.discordUserId);
          setNowPlayingState(state);
        } catch (error) {
          setNowPlayingState({ isPlaying: false });
        }
      }

      refreshNowPlaying();
      setInterval(
        refreshNowPlaying,
        (profileData.spotify && profileData.spotify.refreshMs) || 30000
      );

      let resizeFitTimer = null;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeFitTimer);
        resizeFitTimer = window.setTimeout(refreshNowPlayingTitleFit, 150);
      });

      // --- Player Modal Logic -------------------------------------------------
      function formatTime(ms) {
        const safeMs = Number.isFinite(ms) ? Math.max(0, ms) : 0;
        const totalSeconds = Math.floor(safeMs / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function stopPlayerProgressTimer() {
        if (playerProgressTimer) {
          clearInterval(playerProgressTimer);
          playerProgressTimer = null;
        }
      }

      function updatePlayerProgress() {
        if (
          !currentNowPlayingState ||
          !currentNowPlayingState.isPlaying ||
          !currentNowPlayingState.startedAt ||
          !currentNowPlayingState.endsAt ||
          currentNowPlayingState.endsAt <= currentNowPlayingState.startedAt
        ) {
          playerProgressBar.style.width = "0%";
          playerTimeCurrent.textContent = "0:00";
          playerTimeTotal.textContent = "0:00";
          return;
        }

        const total = currentNowPlayingState.endsAt - currentNowPlayingState.startedAt;
        const elapsed = Date.now() - currentNowPlayingState.startedAt;
        const clampedElapsed = Math.min(Math.max(elapsed, 0), total);
        const progressPercent = (clampedElapsed / total) * 100;

        playerProgressBar.style.width = `${progressPercent}%`;
        playerTimeCurrent.textContent = formatTime(clampedElapsed);
        playerTimeTotal.textContent = formatTime(total);
      }

      function startPlayerProgressTimer() {
        stopPlayerProgressTimer();
        updatePlayerProgress();
        playerProgressTimer = setInterval(updatePlayerProgress, 1000);
      }

      function isPlayerModalOpen() {
        return playerModal.classList.contains("active");
      }

      function openPlayerModal() {
        lastFocusedBeforeModal = document.activeElement;
        playerModal.classList.add("active");
        document.body.classList.add("modal-open");
        updatePlayerDisplay();
        playerCloseBtn.focus();
      }

      function closePlayerModal() {
        if (!isPlayerModalOpen()) {
          return;
        }

        playerModal.classList.remove("active");
        document.body.classList.remove("modal-open");
        stopPlayerProgressTimer();
        playSFX('close');

        if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === "function") {
          lastFocusedBeforeModal.focus();
        }
        lastFocusedBeforeModal = null;
      }

      function updatePlayerDisplay() {
        if (!currentNowPlayingState || !currentNowPlayingState.isPlaying) {
          document.getElementById("playerTrackTitle").textContent = "Not Playing";
          document.getElementById("playerTrackArtist").textContent = "Start listening on Spotify";
          document.getElementById("playerTrackAlbum").textContent = "";
          document.getElementById("playerAlbumArt").src = FALLBACK_ALBUM_ART;
          playerListenBtn.href = "https://open.spotify.com";
          playerListenBtn.classList.add("is-idle");
          stopPlayerProgressTimer();
          updatePlayerProgress();
          return;
        }

        document.getElementById("playerTrackTitle").textContent = currentNowPlayingState.title;
        document.getElementById("playerTrackArtist").textContent = currentNowPlayingState.artist;
        document.getElementById("playerTrackAlbum").textContent = currentNowPlayingState.album || "Live on Spotify";
        document.getElementById("playerAlbumArt").src = safeImageUrl(
          currentNowPlayingState.imageUrl,
          FALLBACK_ALBUM_ART
        );
        playerListenBtn.href = normalizeUrl(currentNowPlayingState.trackUrl) || "https://open.spotify.com";
        playerListenBtn.classList.remove("is-idle");
        startPlayerProgressTimer();
      }

      playerCloseBtn.addEventListener("click", closePlayerModal);

      // Clicking the backdrop (but not the card itself) closes the modal.
      playerModal.addEventListener("click", (event) => {
        if (event.target === playerModal) {
          closePlayerModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isPlayerModalOpen()) {
          event.preventDefault();
          closePlayerModal();
        }
      });

      playerListenBtn.addEventListener("click", () => {
        playSFX('click');
      });

      linksEl.addEventListener("click", (event) => {
        const linkButton = event.target.closest(".link-btn");
        if (!linkButton) {
          return;
        }

        event.preventDefault();

        // Check if it's the now playing link
        if (linkButton.dataset.linkId === "nowPlaying") {
          playSFX('open');
          openPlayerModal();
          return;
        }

        openProfileLink(linkButton.dataset.url);
      });

      // Hover SFX, delegated so links rendered later still get it.
      document.addEventListener(
        "mouseover",
        (event) => {
          const target = event.target.closest(".link-btn, .player-listen-btn, .socials-inline a");
          if (!target) {
            return;
          }

          // Ignore moves that stay inside the same element.
          if (event.relatedTarget && target.contains(event.relatedTarget)) {
            return;
          }

          playSFX('hover');
        },
        true
      );

      const projectsEl = document.getElementById("projectsList");
      profileData.projects.forEach((project) => {
        const card = document.createElement("article");
        card.className = "project-card";
        const projectThumb = project.image
          ? `<img class="project-thumb" src="${escapeHtml(project.image)}" alt="${escapeHtml(project.title)} icon" />`
          : "";
        // project.description is authored here in profileData and intentionally
        // allows inline markup; project.title is escaped.
        card.innerHTML = `<div class="project-title-row">${projectThumb}<h3 class="project-title">${escapeHtml(project.title)}</h3></div><p class="project-desc">${project.description}</p>`;
        projectsEl.appendChild(card);
      });

      const projectLinksEl = document.getElementById("projectLinks");
      const projectsWithLinks = profileData.projects.filter((project) => project.href && project.href.trim());

      if (projectsWithLinks.length === 0) {
        const emptyText = document.createElement("p");
        emptyText.className = "project-links-empty";
        emptyText.textContent = "Add project URLs in profileData.projects to show them here.";
        projectLinksEl.appendChild(emptyText);
      } else {
        projectsWithLinks.forEach((project, i) => {
          const a = document.createElement("a");
          a.className = "link-btn project-link-btn";
          a.href = normalizeUrl(project.href) || "#";
          a.dataset.url = project.href;
          a.target = "_blank";
          a.rel = "noreferrer noopener";
          a.style.animationDelay = `${100 + i * 75}ms`;
          const hoverThumb = project.image || "./filearchive/cornwallCOREpfp.png";
          a.innerHTML = `<span class="left">${escapeHtml(project.title)}</span><span class="right">Open</span><img class="project-link-hover-thumb" src="${escapeHtml(hoverThumb)}" alt="" aria-hidden="true" />`;
          projectLinksEl.appendChild(a);
        });
      }

      projectLinksEl.addEventListener("click", (event) => {
        const linkButton = event.target.closest(".link-btn");
        if (!linkButton) {
          return;
        }

        event.preventDefault();
        openProfileLink(linkButton.dataset.url);
      });

      const policyLinksEl = document.getElementById("policyLinks");
      profileData.policyLinks.forEach((link, i) => {
        const a = document.createElement("a");
        a.className = "link-btn";
        a.href = normalizeUrl(link.href) || "#";
        a.dataset.url = link.href;
        a.target = "_blank";
        a.rel = "noreferrer noopener";
        a.style.animationDelay = `${100 + i * 75}ms`;
        a.innerHTML = `<span class="left">${escapeHtml(link.label)}</span><span class="right">${escapeHtml(link.tag)}</span>`;
        policyLinksEl.appendChild(a);
      });

      policyLinksEl.addEventListener("click", (event) => {
        const linkButton = event.target.closest(".link-btn");
        if (!linkButton) {
          return;
        }

        event.preventDefault();
        openProfileLink(linkButton.dataset.url);
      });

      const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
      const tabPanels = document.querySelectorAll(".tab-panel");

      function setActiveTab(tabId, shouldFocus = false) {
        tabButtons.forEach((button) => {
          const isSelected = button.id === tabId;
          button.setAttribute("aria-selected", isSelected ? "true" : "false");
          // Roving tabindex: only the selected tab is in the tab order.
          button.tabIndex = isSelected ? 0 : -1;
          if (isSelected && shouldFocus) {
            button.focus();
          }
        });

        tabPanels.forEach((panel) => {
          const shouldShow = panel.getAttribute("aria-labelledby") === tabId;
          panel.hidden = !shouldShow;
        });
      }

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setActiveTab(button.id);
        });
      });

      document.querySelector(".tabs").addEventListener("keydown", (event) => {
        const currentIndex = tabButtons.findIndex(
          (button) => button.getAttribute("aria-selected") === "true"
        );
        if (currentIndex === -1) {
          return;
        }

        let nextIndex = null;
        if (event.key === "ArrowRight") {
          nextIndex = (currentIndex + 1) % tabButtons.length;
        } else if (event.key === "ArrowLeft") {
          nextIndex = (currentIndex - 1 + tabButtons.length) % tabButtons.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = tabButtons.length - 1;
        }

        if (nextIndex === null) {
          return;
        }

        event.preventDefault();
        setActiveTab(tabButtons[nextIndex].id, true);
      });

      // Sync the roving tabindex with the tab selected in the markup.
      setActiveTab(
        (tabButtons.find((button) => button.getAttribute("aria-selected") === "true") || tabButtons[0]).id
      );

      const socialsInlineEl = document.getElementById("socialLinksInline");

      profileData.socials.forEach((social) => {
        const aInline = document.createElement("a");
        const iconMarkup = getSocialIconMarkup(social.label, social.href);
        aInline.href = normalizeUrl(social.href) || "#";
        aInline.dataset.url = social.href;
        aInline.target = "_blank";
        aInline.rel = "noreferrer noopener";
        aInline.setAttribute("aria-label", social.label);
        aInline.title = social.label;
        aInline.innerHTML = iconMarkup;
        socialsInlineEl.appendChild(aInline);
      });

      socialsInlineEl.addEventListener("click", (event) => {
        const socialLink = event.target.closest("a");
        if (!socialLink) {
          return;
        }

        event.preventDefault();
        playSFX('click');
        openProfileLink(socialLink.dataset.url);
      });
    </script>
  </body>
</html>
