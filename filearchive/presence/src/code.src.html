<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>presence - large image source - code</title>
    <!--
      Fonte de filearchive/presence/large/code.png (512x512). Mesmo emblema do
      idle.src.html, reduzido, com uma constelacao fina de linhas e pontos de
      estrela em volta - usada quando a presenca detecta uma linguagem de
      codigo sendo editada.

      As linhas da constelacao sao estaticas (coordenadas fixas), ligando
      pontos espalhados pelo quadro todo, por fora do raio do emblema, para
      nao competir com a esfera prateada.
    -->
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #050506;
        display: grid;
        place-items: start;
      }

      .frame {
        width: 512px;
        height: 512px;
        position: relative;
        display: grid;
        place-items: center;
        background: #050506;
      }

      .constellation {
        position: absolute;
        inset: 0;
      }

      .emblem {
        position: relative;
        width: 230px;
        height: 230px;
      }

      .emblem svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg class="constellation" viewBox="0 0 512 512" aria-hidden="true">
        <g fill="none" stroke="#c9ced6" stroke-width="1" stroke-opacity="0.4">
          <path d="M 54 92 L 112 148 L 92 224" />

        <g fill="#ffffff">
          <circle cx="54" cy="92" r="2.6" fill-opacity="0.95" />
          <circle cx="112" cy="148" r="1.8" fill-opacity="0.8" />
          <circle cx="92" cy="224" r="2.2" fill-opacity="0.85" />
          <circle cx="168" cy="118" r="1.6" fill-opacity="0.7" />
          <circle cx="420" cy="70" r="2.4" fill-opacity="0.9" />
          <circle cx="452" cy="132" r="1.8" fill-opacity="0.8" />
          <circle cx="398" cy="162" r="1.6" fill-opacity="0.7" />
          <circle cx="486" cy="186" r="2" fill-opacity="0.8" />
          <circle cx="62" cy="372" r="2.2" fill-opacity="0.85" />

          <circle cx="104" cy="408" r="1.6" fill-opacity="0.7" />
          <circle cx="160" cy="360" r="1.4" fill-opacity="0.6" />
          <circle cx="418" cy="356" r="2.4" fill-opacity="0.9" />

          <circle cx="436" cy="452" r="2" fill-opacity="0.8" />
          <circle cx="408" cy="420" r="1.5" fill-opacity="0.65" />
          <circle cx="256" cy="46" r="1.8" fill-opacity="0.75" />
          <circle cx="300" cy="70" r="1.4" fill-opacity="0.6" />

      <div class="emblem">
        <svg viewBox="0 0 400 400" aria-hidden="true">
