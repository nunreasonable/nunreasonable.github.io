<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-banner source</title>
    <!--
      Fonte do banner de embed (filearchive/og-banner.png).

      Fica versionado ao lado do PNG para o banner poder ser refeito: abrir este
      arquivo, capturar a .frame em 1200x630 e salvar por cima do PNG. Foi
      escrito em HTML em vez de montado num script de imagem justamente para
      herdar as fontes, os gradientes e o carmim da propria pagina - o embed
      parece o site, e nao uma aproximacao dele.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-start: #040203;
        --bg-mid: #0b0408;
        --bg-end: #1d0813;
        --text: #e7eef7;
        --muted: #9caac0;
        --accent-lit: #ff2d62;
        --accent-glow: rgba(255, 45, 98, 0.55);
        --accent-line: rgba(255, 45, 98, 0.32);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #000;
        display: grid;
        place-items: start;
      }

      /*
       * Banner do portfolio: a esquerda o nome, como no hero da home; a
       * direita as capas dos projetos em leque, as mesmas imagens dos cards de
       * "Selected work". O embed passa a dizer "portfolio" antes de qualquer
       * texto ser lido.
       */
      .frame {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(46% 60% at 14% 22%, rgba(255, 45, 98, 0.24) 0%, transparent 70%),
          radial-gradient(44% 60% at 88% 70%, rgba(158, 0, 47, 0.34) 0%, transparent 72%),
          linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 62%, var(--bg-end) 100%);
      }

      /* Mesma trama de pontos do site. */
      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image: radial-gradient(#ffffff 0.5px, transparent 0.5px);
        background-size: 3px 3px;
      }

      .copy {
        position: absolute;
        z-index: 2;
        left: 72px;
        top: 64px;
        bottom: 56px;
        width: 560px;
        display: flex;
        flex-direction: column;
      }

      .id {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      /*
       * Monograma da assinatura (o Z coroado, brand/monogram.svg, tirado do
       * kit da assinatura sem os metadados C2PA) no lugar da foto. A foto saiu
       * porque o embed e estatico e nao acompanhava a troca de avatar do
       * Discord; o monograma e a marca fixa. Brilho carmim por baixo para ele
       * casar com o resto do banner.
       */
      /* Traco dobrado (brand/monogram-bold.svg): o Discord mostra o banner a
         ~1/3 do tamanho, e o traco original sumia nessa escala. */
      .mono {
        width: 132px;
        height: 132px;
        flex: 0 0 auto;
        margin: -24px -14px -24px -26px;
        filter: drop-shadow(0 0 14px rgba(255, 45, 98, 0.55));
      }

      .eyebrow {
        margin: 0;
        font-size: 19px;
        line-height: 1.45;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .eyebrow strong {
        color: var(--text);
        font-weight: 500;
      }

      h1 {
        margin: 34px 0 0;
        /* "daeese" e sempre minusculo, e a Bebas Neue so tem maiusculas. */
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 164px;
        line-height: 0.9;
        letter-spacing: -0.055em;
        background: linear-gradient(180deg, #ffffff 0%, #ffd9e2 50%, var(--accent-lit) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 26px rgba(255, 45, 98, 0.28));
      }

      .tagline {
        margin: 26px 0 0;
        font-size: 27px;
        line-height: 1.35;
        color: #d2deee;
        max-width: 520px;
        text-wrap: balance;
      }

      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .foot b {
        /* O dominio e o nome: nunca em caixa alta, mesmo no rodape em versalete. */
        text-transform: none;
        letter-spacing: 0.04em;
      }

      .foot::before {
        content: "";
        width: 34px;
        height: 3px;
        border-radius: 3px;
        background: var(--accent-lit);
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .foot b {
        color: var(--accent-lit);
        font-weight: 500;
      }

      /* --- Discografia ---------------------------------------------- */
      /*
       * Como a home: cada projeto e um lancamento com capa quadrada. Quatro
       * capas em leque e um vinil saindo da da frente. O Discord mostra o
       * banner a ~1/3, entao poucas capas e grandes.
       */
      .sleeve {
        position: absolute;
        z-index: 1;
        margin: 0;
        width: 250px;
        height: 250px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #000;
        box-shadow: 0 30px 60px -18px rgba(0, 0, 0, 0.9), 0 0 60px -30px var(--accent-glow);
      }
      .sleeve img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .sleeve figcaption {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 15px;
        color: var(--text);
        background: rgba(4, 2, 3, 0.8);
        border: 1px solid var(--accent-line);
      }
      .s-oath { left: 650px; top: 300px; transform: rotate(-9deg); }
      .s-sol { left: 930px; top: 40px; transform: rotate(7deg); }
      .s-sol img { object-position: left top; }
      .s-rose {
        left: 690px; top: 56px; transform: rotate(-4deg);
        background: #3a0d1f;
        display: grid;
        place-items: center;
      }
      .s-rose img { width: 58%; height: 58%; object-fit: contain; }
      .s-ii {
        z-index: 3;
        left: 860px; top: 300px;
        width: 290px; height: 290px;
        transform: rotate(3deg);
        border-color: var(--accent-line);
      }
      /* O vinil saindo da capa da frente, como na home. */
      .vinyl {
        position: absolute;
        z-index: 2;
        left: 676px; top: 318px;
        width: 270px; height: 270px;
        border-radius: 50%;
        background:
          radial-gradient(circle, #ff2d62 0 12%, #1a0710 12.5% 13.5%, transparent 14%),
          repeating-radial-gradient(circle, #0c0508 0 3px, #170a10 3px 4px);
        box-shadow: 0 20px 40px -14px rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <figure class="sleeve s-oath"><img src="./projects/blood-oath/cover.webp" alt="" /></figure>
      <figure class="sleeve s-rose"><img src="../apps/ginrose/assets/ginrose.webp" alt="" /></figure>
      <figure class="sleeve s-sol"><img src="./projects/sollarety/page.mid.webp" alt="" /></figure>
      <div class="vinyl" aria-hidden="true"></div>
      <figure class="sleeve s-ii">
        <img src="./projects/ii-windows/cover.webp" alt="" />
        <figcaption>Trampolining Teapot</figcaption>
      </figure>
      <div class="copy">
        <div class="id">
          <img class="mono" src="./brand/monogram-bold.svg" alt="" />
          <p class="eyebrow"><strong>Fullstack developer</strong><br />Discography</p>
        </div>
        <h1>daeese</h1>
        <p class="tagline">Desktop shells, Discord bots and Roblox launchers, from Rust and C# to Luau.</p>
        <p class="foot"><b>daeese.me</b>&nbsp;· 9 releases</p>
      </div>
    </div>
  </body>
</html>
