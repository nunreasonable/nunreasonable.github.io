<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-banner source</title>
    <!--
      Fonte do banner de embed (filearchive/og-banner.png).

      Fica versionado ao lado do PNG para o banner poder ser refeito: abrir este
      arquivo, capturar a .frame em 1200x630 e salvar por cima do PNG. Foi
      escrito em HTML em vez de montado num script de imagem justamente para
      herdar as fontes, os gradientes e o carmim da propria pagina - o embed
      parece o site, e nao uma aproximacao dele.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-start: #040203;
        --bg-mid: #0b0408;
        --bg-end: #1d0813;
        --text: #e7eef7;
        --muted: #9caac0;
        --accent-lit: #ff2d62;
        --accent-glow: rgba(255, 45, 98, 0.55);
        --accent-line: rgba(255, 45, 98, 0.32);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #000;
        display: grid;
        place-items: start;
      }

      /*
       * Banner do portfolio: a esquerda o nome, como no hero da home; a
       * direita as capas dos projetos em leque, as mesmas imagens dos cards de
       * "Selected work". O embed passa a dizer "portfolio" antes de qualquer
       * texto ser lido.
       */
      .frame {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(46% 60% at 14% 22%, rgba(255, 45, 98, 0.24) 0%, transparent 70%),
          radial-gradient(44% 60% at 88% 70%, rgba(158, 0, 47, 0.34) 0%, transparent 72%),
          linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 62%, var(--bg-end) 100%);
      }

      /* Mesma trama de pontos do site. */
      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image: radial-gradient(#ffffff 0.5px, transparent 0.5px);
        background-size: 3px 3px;
      }

      .copy {
        position: absolute;
        z-index: 2;
        left: 72px;
        top: 64px;
        bottom: 56px;
        width: 560px;
        display: flex;
        flex-direction: column;
      }

      .id {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      /*
       * Monograma da assinatura (o Z coroado, brand/monogram.svg, tirado do
       * kit da assinatura sem os metadados C2PA) no lugar da foto. A foto saiu
       * porque o embed e estatico e nao acompanhava a troca de avatar do
       * Discord; o monograma e a marca fixa. Brilho carmim por baixo para ele
       * casar com o resto do banner.
       */
      /* Traco dobrado (brand/monogram-bold.svg): o Discord mostra o banner a
         ~1/3 do tamanho, e o traco original sumia nessa escala. */
      .mono {
        width: 132px;
        height: 132px;
        flex: 0 0 auto;
        margin: -24px -14px -24px -26px;
        filter: drop-shadow(0 0 14px rgba(255, 45, 98, 0.55));
      }

      .eyebrow {
        margin: 0;
        font-size: 19px;
        line-height: 1.45;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .eyebrow strong {
        color: var(--text);
        font-weight: 500;
      }

      h1 {
        margin: 34px 0 0;
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        font-size: 196px;
        line-height: 0.8;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #ffffff 0%, #ffd9e2 50%, var(--accent-lit) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 26px rgba(255, 45, 98, 0.28));
      }

      .tagline {
        margin: 26px 0 0;
        font-size: 27px;
        line-height: 1.35;
        color: #d2deee;
        max-width: 520px;
      }

      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .foot::before {
        content: "";
        width: 34px;
        height: 3px;
        border-radius: 3px;
        background: var(--accent-lit);
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .foot b {
        color: var(--accent-lit);
        font-weight: 500;
      }

      /* --- Capas em leque ----------------------------------------------- */
      .shot {
        position: absolute;
        z-index: 1;
        margin: 0;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #000;
        box-shadow: 0 30px 60px -18px rgba(0, 0, 0, 0.9), 0 0 60px -30px var(--accent-glow);
      }

      .shot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }

      .shot figcaption {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 15px;
        letter-spacing: 0.06em;
        color: var(--text);
        background: rgba(4, 2, 3, 0.78);
        border: 1px solid var(--accent-line);
      }

      .shot-oath {
        width: 300px;
        height: 375px;
        left: 668px;
        top: 150px;
        transform: rotate(-7deg);
      }

      .shot-sol {
        width: 280px;
        height: 350px;
        left: 905px;
        top: 52px;
        transform: rotate(6deg);
      }

      .shot-ii {
        z-index: 2;
        width: 470px;
        height: 264px;
        left: 712px;
        top: 318px;
        transform: rotate(-1.5deg);
        border-color: var(--accent-line);
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <figure class="shot shot-oath">
        <img src="./projects/blood-oath/poster.webp" alt="" />
      </figure>
      <figure class="shot shot-sol">
        <img src="./projects/sollarety/poster.webp" alt="" />
      </figure>
      <figure class="shot shot-ii">
        <img src="./projects/ii-windows/desktop.webp" alt="" />
        <figcaption>ii on Windows</figcaption>
      </figure>

      <div class="copy">
        <div class="id">
          <img class="mono" src="./brand/monogram-bold.svg" alt="" />
          <p class="eyebrow"><strong>Fullstack developer</strong><br />Portfolio</p>
        </div>
        <h1>DAEESE</h1>
        <p class="tagline">Roblox games, Discord bots and desktop shells, from C# and Luau to <span style="white-space: nowrap">C++</span>.</p>
        <p class="foot"><b>daeese.me</b>&nbsp;· 6 projects</p>
      </div>
    </div>
  </body>
</html>
