<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>discord profile banner source</title>
    <!--
      Fonte do banner do perfil no Discord (filearchive/widget/profile-banner.png).

      Capturar a .frame em 600x240 - a proporcao que o Discord usa no banner de
      perfil. Diferente da arte do Rich Presence, este aparece grande, entao
      aguenta a tagline e as pills da home.

      Atencao ao recorte: o avatar do perfil cobre o canto inferior esquerdo do
      banner, e o nome fica logo abaixo. Por isso o conteudo e alinhado a
      direita e a faixa inferior esquerda foi deixada vazia de proposito.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-start: #040203;
        --bg-mid: #0b0408;
        --bg-end: #1d0813;
        --text: #e7eef7;
        --muted: #9caac0;
        --accent-lit: #ff2d62;
        --accent-glow: rgba(255, 45, 98, 0.55);
        --accent-line: rgba(255, 45, 98, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #000;
        display: grid;
        place-items: start;
      }

      .frame {
        width: 600px;
        height: 240px;
        position: relative;
        overflow: hidden;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(50% 70% at 16% 24%, rgba(255, 45, 98, 0.26) 0%, transparent 70%),
          radial-gradient(44% 60% at 86% 80%, rgba(120, 0, 40, 0.32) 0%, transparent 72%),
          linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 62%, var(--bg-end) 100%);
      }

      .halo {
        position: absolute;
        width: 380px;
        height: 380px;
        right: -60px;
        top: -120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 45, 98, 0.22) 0%, transparent 68%);
        filter: blur(50px);
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.08;
        background-image: radial-gradient(#ffffff 0.5px, transparent 0.5px);
        background-size: 3px 3px;
      }

      .frame::after {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        z-index: 2;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-line) 20%, var(--accent-lit) 50%, var(--accent-line) 80%, transparent);
      }

      .inner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        text-align: right;
        padding: 0 34px 0 200px;
      }

      .eyebrow {
        margin: 0 0 6px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent-lit);
      }

      .eyebrow::after {
        content: "";
        width: 22px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent-lit);
        box-shadow: 0 0 8px var(--accent-glow);
      }

      h1 {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        font-size: 74px;
        line-height: 0.86;
        letter-spacing: 1px;
        background: linear-gradient(180deg, #ffffff 0%, #ffd9e2 50%, var(--accent-lit) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stack {
        margin: 14px 0 0;
        display: flex;
        gap: 6px;
        padding: 0;
        list-style: none;
      }

      .stack li {
        padding: 4px 11px;
        border: 1px solid var(--accent-line);
        border-radius: 999px;
        font-size: 11px;
        color: #ffe7ed;
        background: rgba(255, 45, 98, 0.1);
      }

      .domain {
        position: absolute;
        left: 26px;
        top: 20px;
        z-index: 3;
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="halo"></div>
      <p class="domain">daeese.me</p>
      <div class="inner">
        <p class="eyebrow">Fullstack Developer</p>
        <h1>DAEESE</h1>
        <ul class="stack">
          <li>C#</li>
          <li>JavaScript</li>
          <li>.NET</li>
        </ul>
      </div>
    </div>
  </body>
</html>
