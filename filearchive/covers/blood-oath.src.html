<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>blood-oath cover source</title>
    <!--
      Capa quadrada de "Blood Oath: Brazil 1898" (filearchive/covers/blood-oath.webp).

      Variacao do padrao das capas tipograficas da home (ver covers.css): em
      vez do preto quase total, aqui e uma capa de vinil classica - sleeve de
      papel bege/empoeirado com o disco espiando pelo furo central, rotulo em
      vermelho-sangue com o monograma da assinatura (brand/monogram-bold.svg,
      recolorido). O pedido original foi "bota o monograma e faz parecer uma
      capa de vinil generica"; o tom de papel velho combina com o cangaco de
      1898. A marcha "daeese." e o simbolo continuam no mesmo lugar/tamanho
      do padrao, so a paleta muda - por isso a tinta do titulo e da marca
      ficou escura (sobre papel claro o branco nao pegava contraste).

      Refazer: ./render.sh blood-oath
    -->
    <link rel="stylesheet" href="./covers.css" />
    <style>
      .bo .frame {
        --ink: #2a1206;
        --mark-ink: #3b2414;
        --muted: #6b4b2c;
        --dot: #ff2d62;
        background:
          /* vinheta de borda, papel envelhecido */
          radial-gradient(120% 120% at 50% 50%, transparent 58%, rgba(36, 20, 8, 0.4) 100%),
          /* brilho diagonal, bem sutil, no papel */
          linear-gradient(115deg, rgba(255, 248, 224, 0.5) 0%, transparent 28%),
          /* dois aneis de "ring wear" fora de centro, como papelao usado */
          radial-gradient(circle at 34% 66%, transparent 30.8%, rgba(60, 38, 16, 0.12) 31%, transparent 31.6%),
          radial-gradient(circle at 34% 66%, transparent 24.4%, rgba(60, 38, 16, 0.14) 25%, transparent 25.6%),
          linear-gradient(160deg, #e3cb9c 0%, #caa468 55%, #b4895091 100%);
      }

      /* Lombada do sleeve: fio de luz vertical perto da borda esquerda. */
      .bo .frame::after {
        box-shadow:
          inset 0 1px 0 rgba(255, 252, 240, 0.5),
          inset 10px 0 18px -14px rgba(40, 22, 8, 0.55);
      }

      /* O disco em si: so um triz maior que o rotulo, espiando por tras do
         furo circular do sleeve - a borda escura da ele profundidade. Essa e
         a .cv-symbol (so o top/width mudam - o left:50%+translateX(-50%)
         que centraliza continua vindo do covers.css). */
      .bo .cv-symbol.disc {
        top: 23%;
        width: 50%;
        border-radius: 50%;
        background:
          repeating-conic-gradient(
            from 0deg,
            rgba(0, 0, 0, 0.12) 0deg 1.4deg,
            transparent 1.4deg 3.2deg
          ),
          radial-gradient(circle, #1c1416 0 2%, #0c0809 2% 60%, #050304 100%);
        box-shadow: 0 18px 50px -20px rgba(20, 10, 4, 0.75);
      }

      /* O rotulo vermelho, centralizado no disco. */
      .bo .label {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 38%, #6c1b20 0%, #43090d 62%, #2a0509 100%);
        box-shadow:
          inset 0 0 0 3px rgba(236, 223, 192, 0.65),
          inset 0 2px 10px rgba(0, 0, 0, 0.5);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* Furo do eixo, bem no centro. */
      .bo .label::after {
        content: "";
        position: absolute;
        width: 5.5%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #0a0506;
        box-shadow: 0 0 0 2px rgba(236, 223, 192, 0.35);
      }

      .bo .mono {
        width: 56%;
        height: 56%;
      }

      .bo .mono svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .bo .mono svg g {
        stroke: #ecdfc0 !important;
      }

      .bo .cv-title {
        font-size: 128px;
      }

      .bo .cv-eyebrow {
        bottom: 228px;
      }
    </style>
  </head>

          </span>
        </span>
      </div>

      <p class="cv-eyebrow">Sertão do Nordeste &middot; 1898</p>
