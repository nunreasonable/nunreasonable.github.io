<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ccore cover source</title>
    <!--
      Capa quadrada do ccore (filearchive/covers/ccore.webp).

      Padrao das capas tipograficas da home (ver covers.css): a imagem e o
      mesmo brasao que o dashboard usa como login-emblem
      (filearchive/icons/ccore-badge.webp, 238x238, ja circular sobre fundo
      branco - conferido em cornwallcore/administration/dashboard/index.html).
      Brilho diagonal em vermelho e dourado, puxando pras cores do proprio
      brasao, em vez do carmim piso do resto do site. Titulo "ccore" em
      minusculas, como a marca - "Discord Application" fica pequeno, como
      subtitulo.

      Refazer: ./render.sh ccore
    -->
    <link rel="stylesheet" href="./covers.css" />
    <style>
      .cc .frame {
        --bg0: #130a08 ;
        --bg1: #050302;
        --sheen: rgba(212, 160, 64, 0.18);
        --sheen-pos: 84% 8%;
        --ink: #f6efe4;
        --mark-ink: #f6efe4;
        --muted: #b79a74;
        --dot: #ff2d62;
        background:
          radial-gradient(60% 46% at var(--sheen-pos), var(--sheen) 0%, transparent 72%),
          radial-gradient(50% 40% at 18% 86%, rgba(158, 0, 47, 0.22) 0%, transparent 74%),
          linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
      }

      .cc .cv-symbol {
        top: 11%;
        width: 32%;
      }

      .cc .badge {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: block;
        filter: drop-shadow(0 16px 34px rgba(0, 0, 0, 0.55));
      }

      .cc .cv-eyebrow {
        bottom: 236px;
      }
    </style>
  </head>
  <body class="cc">
    <div class="frame" id="frame">
      <span class="cv-symbol">
        <img class="badge" src="../icons/ccore-badge.webp" alt="" width="238" height="238" />
      </span>

      <span class="cv-mark">daeese<span>.</span></span>
      <p class="cv-eyebrow">12&deg; Regimento de Infantaria &middot; Discord App</p>
      <h1 class="cv-title">ccore</h1>
    </div>
  </body>
</html>
