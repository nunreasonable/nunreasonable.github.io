<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccore Privacy Policy</title>
    <link rel="canonical" href="https://ccore.daeese.me/privacypolicy/" />
    <!--
      Cartao de compartilhamento. Estas paginas sao justamente as registradas no
      Discord Developer Portal e as coladas em canal do Discord, onde o embed e a
      primeira coisa que aparece - e sem og: o link saia sem titulo nem imagem.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="daeese.me" />
    <meta property="og:title" content="ccore Privacy Policy" />
    <meta property="og:description" content="What ccore collects, why, how long it is kept and how to request its deletion." />
    <meta property="og:url" content="https://ccore.daeese.me/privacypolicy/" />
    <meta property="og:image" content="https://daeese.me/filearchive/cornwallCOREpfp.png" />
    <meta property="og:image:alt" content="The cornwallCORE profile picture" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ccore Privacy Policy" />
    <meta name="twitter:description" content="What ccore collects, why, how long it is kept and how to request its deletion." />
    <meta name="twitter:image" content="https://daeese.me/filearchive/cornwallCOREpfp.png" />
    <meta name="description" content="Direct entry point for the ccore APP Privacy Policy." />
    <link rel="icon" type="image/png" href="../../filearchive/newpfp.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: rgba(17, 24, 39, 0.94);
        --line: rgba(148, 163, 184, 0.18);
        --text: #e5eef8;
        --muted: #a8b3c5;
        --accent: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(52, 211, 153, 0.16), transparent 30%),
          linear-gradient(160deg, var(--bg) 0%, #131926 100%);
      }

      .shell {
        width: min(1200px, calc(100% - 24px));
        margin: 0 auto;
        padding: 18px 0 24px;
      }

      .intro {
        margin: 0 0 14px;
      }

      .intro h1 {
        font-size: clamp(1.4rem, 3vw, 2rem);
        margin: 0 0 6px;
        color: var(--text);
      }

      .intro p {
        margin: 0 0 8px;
        color: var(--muted);
        line-height: 1.5;
        max-width: 70ch;
      }

      .intro a {
        color: var(--accent);
      }

      .frame {
        width: 100%;
        height: calc(100vh - 190px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(17, 24, 39, 0.72);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: transparent;
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 14px, 1200px);
          padding-top: 8px;
        }

        .frame {
          height: calc(100vh - 210px);
        }
      }
    </style>
      <link rel="stylesheet" href="../../filearchive/i18n/i18n.css" />
  </head>
  <body>
    <div data-i18n-switcher class="i18n-floating"></div>
    <main class="shell">
      <!--
        Este resumo nao e enfeite. A pagina era so o iframe, entao a URL que
        esta no sitemap E registrada no portal do Discord nao tinha texto
        nenhum para indexar - e o canonical de pp.html aponta
        justamente para ca, o que fazia o alvo canonico ser a pagina vazia.
      -->
      <div class="intro">
        <h1 data-i18n="ccore_pp_shell.ccore_privacy_policy">ccore — Privacy Policy</h1>
        <p data-i18n="ccore_pp_shell.this_privacy_policy_explains_what">This Privacy Policy explains what data ccore (“chavinhoCORE”) collects, why it is collected, how long it is kept, who it is shared with, and how to request its deletion.</p>
        <p><a data-i18n="ccore_pp_shell.read_the_full_privacy_policy" href="./pp.html">Read the full Privacy Policy</a></p>
      </div>
      <section data-i18n-attr="aria-label:ccore_pp_shell.privacy_policy_content" class="frame" aria-label="Privacy Policy content">
        <iframe title="ccore Privacy Policy" src="./pp.html"></iframe>
      </section>
    </main>
      <!--
      Seletor de idioma. O ingles fica no proprio HTML; o modulo carrega so o
      dicionario de portugues, entao a pagina continua completa e indexavel
      sem JavaScript.
    -->
    <script type="module" src="../../filearchive/i18n/i18n.js" data-dict="dict/ccore_pp_shell.js"></script>
  </body>
</html>
