<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccore Privacy Policy</title>
    <meta name="description" content="Direct entry point for the ccore APP Privacy Policy." />
    <link rel="icon" type="image/png" href="../../filearchive/newpfp.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: rgba(17, 24, 39, 0.94);
        --line: rgba(148, 163, 184, 0.18);
        --text: #e5eef8;
        --muted: #a8b3c5;
        --accent: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(52, 211, 153, 0.16), transparent 30%),
          linear-gradient(160deg, var(--bg) 0%, #131926 100%);
      }

      .shell {
        width: min(1200px, calc(100% - 24px));
        margin: 0 auto;
        padding: 18px 0 24px;
      }

      .intro {
        margin: 0 0 14px;
      }

      .intro h1 {
        font-size: clamp(1.4rem, 3vw, 2rem);
        margin: 0 0 6px;
        color: var(--text);
      }

      .intro p {
        margin: 0 0 8px;
        color: var(--muted);
        line-height: 1.5;
        max-width: 70ch;
      }

      .intro a {
        color: var(--accent);
      }

      .frame {
        width: 100%;
        height: calc(100vh - 190px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(17, 24, 39, 0.72);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: transparent;
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 14px, 1200px);
          padding-top: 8px;
        }

        .frame {
          height: calc(100vh - 210px);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <!--
        Este resumo nao e enfeite. A pagina era so o iframe, entao a URL que
        esta no sitemap E registrada no portal do Discord nao tinha texto
        nenhum para indexar - e o canonical de pp.html aponta
        justamente para ca, o que fazia o alvo canonico ser a pagina vazia.
      -->
      <div class="intro">
        <h1>ccore — Privacy Policy</h1>
        <p>This Privacy Policy explains what data ccore (“chavinhoCORE”) collects, why it is collected, how long it is kept, who it is shared with, and how to request its deletion.</p>
        <p><a href="./pp.html">Read the full Privacy Policy</a></p>
      </div>
      <section class="frame" aria-label="Privacy Policy content">
        <iframe title="ccore Privacy Policy" src="./pp.html"></iframe>
      </section>
    </main>
  </body>
</html>
