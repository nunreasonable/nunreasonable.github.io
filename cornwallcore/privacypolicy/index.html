<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Esta pagina nunca deve aparecer dentro de outra (ex.: link clicado no
      // documento embutido): se estiver num quadro, abre na janela inteira.
      if (window.top !== window.self) {
        try {
          window.top.location.href = window.location.href;
        } catch (e) {}
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccore Privacy Policy</title>
    <link rel="canonical" href="https://ccore.daeese.me/privacypolicy/" />
    <!--
      Cartao de compartilhamento. Estas paginas sao justamente as registradas no
      Discord Developer Portal e as coladas em canal do Discord, onde o embed e a
      primeira coisa que aparece - e sem og: o link saia sem titulo nem imagem.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="daeese.me" />
    <meta property="og:title" content="ccore Privacy Policy" />
    <meta property="og:description" content="What ccore collects, why, how long it is kept and how to request its deletion." />
    <meta property="og:url" content="https://ccore.daeese.me/privacypolicy/" />
    <meta property="og:image" content="https://daeese.me/filearchive/cornwallCOREpfp.png" />
    <meta property="og:image:alt" content="The cornwallCORE profile picture" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ccore Privacy Policy" />
    <meta name="twitter:description" content="What ccore collects, why, how long it is kept and how to request its deletion." />
    <meta name="twitter:image" content="https://daeese.me/filearchive/cornwallCOREpfp.png" />
    <meta name="description" content="Direct entry point for the ccore APP Privacy Policy." />
    <meta name="theme-color" content="#1e0e10" />
    <link rel="icon" type="image/png" href="../../filearchive/icons/ccore-badge-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      theme.js antes do CSS e sem defer: marca data-theme no <html> antes da
      primeira pintura, senao quem escolheu o tema oposto ao do sistema veria a
      pagina piscar.
    -->
    <script src="../../filearchive/ccore/theme.js?v=3"></script>
    <link rel="stylesheet" href="../../filearchive/ccore/theme.css?v=3" />
    <style>
      /*
       * Casca simples: cabecalho com a marca e o link de volta, intro em uma
       * coluna de leitura, iframe sem moldura com o documento completo.
       */
      main.shell {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 32px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand img {
        width: 28px;
        height: 28px;
        display: block;
      }

      .brand-word {
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }

      .header-links {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
      }

      .header-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.92rem;
      }

      .header-links a:hover,
      .header-links a:focus-visible {
        color: var(--text);
      }

      .intro {
        max-width: 68ch;
        margin-bottom: 28px;
      }

      .intro h1 {
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }

      .intro p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.65;
      }

      .frame {
        border: 0;
      }

      iframe {
        width: 100%;
        height: 80vh;
        min-height: 600px;
        border: 0;
        display: block;
        background: transparent;
      }

      @media (max-width: 640px) {
        main.shell {
          padding-top: 20px;
        }
      }
    </style>
      <link rel="stylesheet" href="../../filearchive/i18n/i18n.css" />
  </head>
  <body>
    <button id="themeToggle" class="theme-toggle" type="button">Theme: system</button>
    <main class="shell">
      <header class="page-header">
        <div class="brand">
          <img src="../../filearchive/icons/ccore-badge-96.webp" width="28" height="28" alt="" />
          <span class="brand-word">ccore</span>
        </div>
        <nav class="header-links" aria-label="Navigation">
          <a href="../" data-i18n="ccore_pp_shell.back">Back to ccore</a>
          <div data-i18n-switcher></div>
        </nav>
      </header>
      <!--
        Este resumo nao e enfeite. A pagina era so o iframe, entao a URL que
        esta no sitemap E registrada no portal do Discord nao tinha texto
        nenhum para indexar - e o canonical de pp.html aponta
        justamente para ca, o que fazia o alvo canonico ser a pagina vazia.
      -->
      <div class="intro">
        <h1 data-i18n="ccore_pp_shell.ccore_privacy_policy">ccore — Privacy Policy</h1>
        <p data-i18n="ccore_pp_shell.this_privacy_policy_explains_what">This Privacy Policy explains what data ccore collects, why it is collected, how long it is kept, who it is shared with, and how to request its deletion.</p>
        <p><a class="button" data-i18n="ccore_pp_shell.read_the_full_privacy_policy" href="./pp.html">Read the full Privacy Policy</a></p>
      </div>
      <section data-i18n-attr="aria-label:ccore_pp_shell.privacy_policy_content" class="frame" aria-label="Privacy Policy content">
        <iframe title="ccore Privacy Policy" src="./pp.html?embedded=1&amp;v=20261120-1"></iframe>
      </section>
    </main>
      <!--
      Seletor de idioma. O ingles fica no proprio HTML; o modulo carrega so o
      dicionario de portugues, entao a pagina continua completa e indexavel
      sem JavaScript.
    -->
    <script type="module" src="../../filearchive/i18n/i18n.js" data-dict="dict/ccore_pp_shell.js?v=20261120-1"></script>
  </body>
</html>
